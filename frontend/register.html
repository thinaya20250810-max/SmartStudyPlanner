<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Smart Study Planner</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="login-page">

    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            🎓
        </div>


        <!-- Application Name -->
        <h1>Smart Study Planner</h1>

        <p class="welcome-text">
            Create your account to get started.
        </p>


        <!-- Registration Form -->
        <form id="registerForm">


            <!-- Full Name -->
            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                >

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                >

            </div>


            <!-- Create Account Button -->
            <button
                    type="submit"
                    class="login-button"
            >
                Create Account
            </button>


            <!-- Login Link -->
            <div class="register-section">

                <p>
                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>


        </form>

    </div>

</div>

</body>

</html>
